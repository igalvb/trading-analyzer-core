# Nightly pipeline. Decision F-76: dark pool -> Evaluative Index -> RS ranking ->
# macro refresh -> daily automation -> Exit report, all after the US market close.
#
# STARTED BY THE CLOUDFLARE RELAY at 03:23 UTC every day (relay/telegram-relay.worker.mjs, timer `23 3 * * *`;
# docs/RELAY_SCHEDULES_PLAN.md) = 23:23 / 22:23 New York, after the 16:00 close, so the New York date is the trading
# day. GitHub's own schedule was removed 2026-10-29: it did not fire on 10-28 and fired 7 hours late on 10-29 (during
# the next morning), and a late queued run could cancel a waiting /analyze. Manual runs: Actions > Nightly > Run.
name: Nightly

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Also run typecheck and the test suite first (about 2 extra minutes)'
        type: boolean
        default: false
      user:
        description: 'User id. owner = you (repo secrets; the built-in profile if this copy has one, else your Profile tab). Another id uses the secrets named ID_NAME and its Profile tab'
        type: string
        default: owner

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (inputs.user || 'owner') == 'owner' && 'sheet-report-writers' || format('sheet-report-writers-{0}', inputs.user) }}
  cancel-in-progress: false

env:
  LONG_HISTORY: 'on'
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  SCRIPT_TIME_ZONE: America/New_York
  RUN_USER: ${{ inputs.user || 'owner' }}
  SECRET_PREFIX: ${{ (inputs.user || 'owner') != 'owner' && format('{0}_', inputs.user) || '' }}
  PROFILE_SOURCE: ${{ (inputs.user || 'owner') != 'owner' && 'sheet' || '' }}

defaults:
  run:
    shell: bash

jobs:
  nightly:
    name: Nightly pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ledger: ${{ steps.ledger.outputs.changed }}
    steps:
      - name: Record start time
        run: |
          echo "NIGHTLY_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "Heartbeat: started $(date -u '+%Y-%m-%d %H:%M:%S') UTC = $(date '+%Y-%m-%d %H:%M:%S %Z') New York"

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out the long price history (docs/LONG_HISTORY_PLAN.md; a missing branch is skipped)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: prices
          path: long-history

      - name: Check out the ledger (docs/LEDGER.md; read only here; a missing branch is skipped)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: data
          path: data-branch

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck (optional)
        if: ${{ inputs.run_checks }}
        working-directory: backend
        run: npm run typecheck

      - name: Run tests (optional)
        if: ${{ inputs.run_checks }}
        working-directory: backend
        # The suite tests the code as the owner, whoever the run is for (GENERIC_PLAN P5).
        env:
          RUN_USER: owner
          PROFILE_SOURCE: ''
        run: npm test

      - name: Read the user profile tab (not for the default user of a copy with a built-in profile)
        if: env.PROFILE_SOURCE == 'sheet' || hashFiles('backend/src/owner/profile.ts') == ''
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: |
          mkdir -p out
          npm run profile-fetch -- --out "$PWD/out/profile.json"
          echo "PROFILE_FILE=$PWD/out/profile.json" >> "$GITHUB_ENV"

      - name: Run nightly pipeline
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          REPORTS_SPREADSHEET_ID: ${{ secrets[format('{0}REPORTS_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          DATA_SPREADSHEET_ID: ${{ secrets[format('{0}DATA_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          FMP_API_KEY: ${{ secrets[format('{0}FMP_API_KEY', env.SECRET_PREFIX)] }}
          ALPHAVANTAGE_KEY: ${{ secrets[format('{0}ALPHAVANTAGE_KEY', env.SECRET_PREFIX)] }}
          FINNHUB_KEY: ${{ secrets[format('{0}FINNHUB_KEY', env.SECRET_PREFIX)] }}
          SEC_CONTACT_EMAIL: ${{ secrets[format('{0}SEC_CONTACT_EMAIL', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
          # Row 38: the digest's "GitHub minutes this month" line reads this repo's runs (actions: read above).
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p out
          export RUN_LOG_FILE="$PWD/out/nightly.log"  # the full log, every level (core/logFile.ts)
          npm run nightly 2>&1 | tee out/nightly.console.log

      - name: Re-lock sheet tabs (always)
        if: always()
        timeout-minutes: 5
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          REPORTS_SPREADSHEET_ID: ${{ secrets[format('{0}REPORTS_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          DATA_SPREADSHEET_ID: ${{ secrets[format('{0}DATA_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
        run: npm run lock-sheets

      - name: Check the log for leaked keys
        if: always()
        working-directory: backend
        env:
          FMP_API_KEY: ${{ secrets[format('{0}FMP_API_KEY', env.SECRET_PREFIX)] }}
          ALPHAVANTAGE_KEY: ${{ secrets[format('{0}ALPHAVANTAGE_KEY', env.SECRET_PREFIX)] }}
          FINNHUB_KEY: ${{ secrets[format('{0}FINNHUB_KEY', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
        run: |
          # Artifacts are NOT masked like the live log is, so check the file itself.
          ls out/nightly*.log >/dev/null 2>&1 || exit 0
          leaked=0
          for name in FMP_API_KEY ALPHAVANTAGE_KEY FINNHUB_KEY TELEGRAM_BOT_TOKEN; do
            value="${!name}"
            if [ "${#value}" -ge 8 ] && grep -qF -- "$value" out/nightly*.log; then
              echo "::error::The value of $name appears in the run log."
              leaked=1
            fi
          done
          if grep -q 'PRIVATE KEY-----' out/nightly*.log; then
            echo "::error::A private key block appears in the run log."
            leaked=1
          fi
          if [ "$leaked" = 1 ]; then
            rm -f out/nightly*.log
            echo "The log file was deleted so it is not uploaded."
            exit 1
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-log-${{ github.run_id }}
          path: backend/out/nightly*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Keep the ledger snapshot for the data branch (profile storage.ledger shadow or on only)
        id: ledger
        if: ${{ !cancelled() }}
        run: |
          # With storage.ledger off the run never touches data-branch/, so nothing is kept and nothing is committed.
          # ledger/prices.json: the Nightly's crypto prices (profile ledger.cryptoPrices on), written with the snapshot.
          if [ -e data-branch/.git ] && [ -n "$(git -C data-branch status --porcelain -- ledger/snapshots.jsonl ledger/prices.json)" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "The ledger snapshot changed; the next job commits it to the data branch."
          fi

      - name: Upload the ledger snapshot
        if: ${{ !cancelled() && steps.ledger.outputs.changed == 'yes' }}
        uses: actions/upload-artifact@v5
        with:
          name: ledger-${{ github.run_id }}
          path: |
            data-branch/ledger/snapshots.jsonl
            data-branch/ledger/prices.json
          retention-days: 7

      - name: Failure notice
        if: failure() || cancelled()
        run: |
          # docs/LOGGING_SPEC.md: the counts come from the full run log (every level; RUN_LOG_FILE).
          full=backend/out/nightly.log
          count() { if [ -f "$full" ]; then grep -cE "^[^ ]+ $1( |$)" "$full" || true; else echo "unknown"; fi; }
          echo "::error::Run log: $(count CRITICAL) CRITICAL, $(count ERROR) ERROR, $(count WARNING) WARNING line(s) (the full log is the nightly.log file of the artifact)."
          echo "- Log lines: $(count CRITICAL) critical, $(count ERROR) error, $(count WARNING) warning" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Nightly run did not finish cleanly. Open the run page and download the nightly-log artifact."
          {
            echo "### Nightly run FAILED"
            echo "GitHub emails the repository owner for failed runs. Download the nightly-log artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run summary
        if: always()
        run: |
          # docs/LOGGING_SPEC.md: the counts come from the full run log (every level; RUN_LOG_FILE).
          full=backend/out/nightly.log
          count() { if [ -f "$full" ]; then grep -cE "^[^ ]+ $1( |$)" "$full" || true; else echo "unknown"; fi; }
          end=$(date +%s)
          mins=$(( (end - ${NIGHTLY_START_EPOCH:-$end}) / 60 ))
          {
            echo "### Nightly run"
            echo "- Result: ${{ job.status }}"
            echo "- Duration: about ${mins} minute(s)"
            echo "- Log lines: $(count CRITICAL) critical, $(count ERROR) error, $(count WARNING) warning"
            echo "- Finished (New York): $(date '+%Y-%m-%d %H:%M %Z')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the dashboard (only when the Cloudflare secrets are set; docs/DASHBOARD.md)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          REPORTS_SPREADSHEET_ID: ${{ secrets[format('{0}REPORTS_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          DATA_SPREADSHEET_ID: ${{ secrets[format('{0}DATA_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          SEC_CONTACT_EMAIL: ${{ secrets[format('{0}SEC_CONTACT_EMAIL', env.SECRET_PREFIX)] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}CLOUDFLARE_API_TOKEN', env.SECRET_PREFIX)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('{0}CLOUDFLARE_ACCOUNT_ID', env.SECRET_PREFIX)] }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DASHBOARD_PROJECT: ${{ vars.DASHBOARD_PROJECT }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Dashboard not set up (no Cloudflare secrets); skipped."
            exit 0
          fi
          project="${DASHBOARD_PROJECT:-trading-dashboard}"
          [ "$RUN_USER" = "owner" ] || project="$project-$RUN_USER"
          npm run dashboard-build -- --out out/dashboard
          cd out/dashboard
          npx --yes wrangler@3.99.0 pages deploy . --project-name "$project" --branch main --commit-dirty=true

  # docs/LEDGER.md phase 3: the one job with write access, and only to the separate `data` branch (never main). It runs
  # only when the Nightly changed ledger/snapshots.jsonl, i.e. only with profile storage.ledger shadow or on.
  ledger:
    name: Commit the ledger snapshot to the data branch
    needs: nightly
    if: ${{ !cancelled() && needs.nightly.outputs.ledger == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the data branch
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch

      - name: Download the ledger snapshot
        uses: actions/download-artifact@v5
        with:
          name: ledger-${{ github.run_id }}
          path: data-branch/ledger

      - name: Commit to the data branch
        run: |
          set -euo pipefail
          cd data-branch
          git config user.name "ledger"
          git config user.email "ledger@users.noreply.github.com"
          git add ledger/snapshots.jsonl
          if [ -f ledger/prices.json ]; then git add ledger/prices.json; fi
          git commit -q -m "Ledger: nightly snapshot $(date '+%Y-%m-%d')" || { echo "Nothing new."; exit 0; }
          git push -q origin HEAD:data
          echo "Committed to branch data."

  # docs/LONG_HISTORY_PLAN.md: keeps the 20-year price history current after each Nightly (owner 2026-11-07), instead
  # of manual Long History runs. Write access only here and only to the separate `prices` branch (never main). The
  # owner's runs only (the default set reads the built-in profile). Append = only the bars after each file's last one,
  # for the default set plus every ticker already on the branch (the extra tickers typed in long-history.yml). A
  # failure here never fails the Nightly (continue-on-error on the job); it shows as a warning on the run page.
  long-history:
    name: Append the new bars to the long price history (prices branch)
    needs: nightly
    if: ${{ !cancelled() && (inputs.user || 'owner') == 'owner' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out the prices branch (a missing branch is skipped; the first fill is the manual backfill)
        id: prices
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: prices
          path: prices-branch

      - name: No prices branch yet
        if: ${{ steps.prices.outcome != 'success' }}
        run: echo "::notice::No prices branch yet; run Actions > Long History > backfill once. Nothing appended."

      - name: Set up Node.js
        if: ${{ steps.prices.outcome == 'success' }}
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: ${{ steps.prices.outcome == 'success' }}
        working-directory: backend
        run: npm ci

      - name: Append the new bars
        if: ${{ steps.prices.outcome == 'success' }}
        working-directory: backend
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/prices-branch/prices"
          mkdir -p "$dir"
          marker="$RUNNER_TEMP/long-history-start"
          touch "$marker"
          npm run long-history -- append "$dir"
          # The tickers already on the branch that the default set did not touch (typed in long-history.yml).
          extra=()
          while IFS= read -r f; do
            t="${f%.csv}"; t="${t/#_/^}"
            if [[ "$t" =~ ^[A-Za-z0-9.^=-]{1,12}$ ]]; then extra+=("$t"); fi
          done < <(find "$dir" -maxdepth 1 -name '*.csv' ! -newer "$marker" -printf '%f\n' | sort)
          if [ "${#extra[@]}" -gt 0 ]; then npm run long-history -- append "$dir" "${extra[@]}"; fi
          npm run long-history -- check "$dir" | tail -n 1

      - name: Commit to the prices branch (only when a price file changed)
        if: ${{ steps.prices.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd prices-branch
          if [ -z "$(git status --porcelain -- 'prices/*.csv')" ]; then echo "No new bars; nothing committed."; exit 0; fi
          git config user.name "long-history"
          git config user.email "long-history@users.noreply.github.com"
          git add prices
          git commit -q -m "Long price history: nightly append $(date '+%Y-%m-%d')"
          git push -q origin HEAD:prices
          echo "Committed to branch prices."

      - name: Failure notice (the Nightly itself is not failed)
        if: ${{ failure() }}
        run: |
          echo "::warning::The long price history append failed; the prices branch was not updated. The Nightly result is unaffected. Re-run Actions > Long History > append by hand if needed."
          echo "### Long price history append FAILED (the Nightly is unaffected)" >> "$GITHUB_STEP_SUMMARY"
