# Telegram check: finds the owner's chat with the bot and sends a test message. Manual only.
# Without TELEGRAM_CHAT_ID it replies in Telegram with the chat number to save as that secret.
name: Telegram Check

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User id. owner = you (repo secrets, your Profile tab). Another id uses the secrets named ID_NAME and its Profile tab'
        type: string
        default: owner

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.user || 'owner') == 'owner' && 'telegram' || format('telegram-{0}', inputs.user) }}
  cancel-in-progress: false

env:
  TZ: America/New_York
  RUN_USER: ${{ inputs.user || 'owner' }}
  SECRET_PREFIX: ${{ (inputs.user || 'owner') != 'owner' && format('{0}_', inputs.user) || '' }}
  PROFILE_SOURCE: sheet

defaults:
  run:
    shell: bash

jobs:
  telegram-check:
    name: Telegram check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Send a test message
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: npm run telegram-check
