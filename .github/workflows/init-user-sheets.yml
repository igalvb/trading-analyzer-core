# Init user sheets (a new user, no terminal needed): adds the template input tabs to a blank My Portfolio sheet:
# Portfolio (stock and options headers, CLOSED marker), 🎯 Watchlist (header + the profile's watchlistSeed) and an
# empty 💾 Script Properties (src/initUserSheets.ts). SAFE: it only ADDS a tab that does not exist; an existing tab is
# never written. Prints no ids or values. Manual only. Needs the ⚙️ Profile tab first (made by hand).
name: Init user sheets

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User id. owner = you (repo secrets; the built-in profile if this copy has one, else your Profile tab). Another id uses the secrets named ID_NAME and its Profile tab'
        type: string
        default: owner

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.user || 'owner') == 'owner' && 'setup' || format('setup-{0}', inputs.user) }}
  cancel-in-progress: false

env:
  TZ: America/New_York
  RUN_USER: ${{ inputs.user || 'owner' }}
  SECRET_PREFIX: ${{ (inputs.user || 'owner') != 'owner' && format('{0}_', inputs.user) || '' }}
  PROFILE_SOURCE: ${{ (inputs.user || 'owner') != 'owner' && 'sheet' || '' }}

defaults:
  run:
    shell: bash

jobs:
  init-user-sheets:
    name: Add the missing input tabs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (no dev tools)
        working-directory: backend
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Read the user profile tab (not for the default user of a copy with a built-in profile)
        if: env.PROFILE_SOURCE == 'sheet' || hashFiles('backend/src/owner/profile.ts') == ''
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: |
          mkdir -p out
          npm run profile-fetch -- --out "$PWD/out/profile.json"
          echo "PROFILE_FILE=$PWD/out/profile.json" >> "$GITHUB_ENV"

      - name: Add the missing input tabs
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
        run: |
          mkdir -p out
          npm run init-user-sheets 2>&1 | tee out/init-user-sheets.log
          exit "${PIPESTATUS[0]}"

      - name: Check the log for leaked keys
        if: always()
        working-directory: backend
        env:
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: |
          # The step summary and the artifact are NOT masked like the live log is, so check the file itself.
          [ -f out/init-user-sheets.log ] || exit 0
          leaked=0
          for name in SPREADSHEET_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value="${!name}"
            if [ "${#value}" -ge 8 ] && grep -qF -- "$value" out/init-user-sheets.log; then
              echo "::error::The value of $name appears in the run log."
              leaked=1
            fi
          done
          if grep -q 'PRIVATE KEY-----' out/init-user-sheets.log; then
            echo "::error::A private key block appears in the run log."
            leaked=1
          fi
          if [ "$leaked" = 1 ]; then
            rm -f out/init-user-sheets.log
            echo "The log file was deleted so it is not shown or uploaded."
            exit 1
          fi

      - name: Show the result in the run summary
        if: always()
        working-directory: backend
        run: |
          [ -f out/init-user-sheets.log ] || exit 0
          {
            echo "### Init user sheets"
            echo
            grep -E '^(✅|Done\.|Nothing to do|Missing|init-user-sheets:)' out/init-user-sheets.log || echo "No result: see the log of the step above."
          } >> "$GITHUB_STEP_SUMMARY"
