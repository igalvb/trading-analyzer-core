# Nightly backup timer (owner approved 2026-11-04).
#
# The Cloudflare relay's timer should start the Nightly at 03:23 UTC, but from 30 Oct to 4 Nov it never did.
# GitHub's own schedules do fire, only 3 to 7 hours late. This file checks twice (03:23 and 05:23 UTC, whenever
# GitHub really runs them) whether a Nightly run was created since 03:00 UTC today:
#   - yes: nothing to do;
#   - no, and it is 13:00 UTC or later (US market hours): do not start it, tell the owner on Telegram;
#   - no, earlier: start nightly.yml on main (run_checks=false) and tell the owner on Telegram.
# No checkout, no npm: about 10 to 20 seconds of free minutes per check. nightly.yml's own triggers are unchanged.
name: Nightly Backup

on:
  schedule:
    - cron: '23 3 * * *'
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-backup
  cancel-in-progress: false

env:
  TZ: UTC

defaults:
  run:
    shell: bash

jobs:
  backup:
    name: Start the Nightly if nothing else did
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and start the Nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUTOFF_UTC_HOUR: '13'
        run: |
          set -uo pipefail
          notify() {
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "Telegram secrets missing; message not sent."
              return 0
            fi
            if curl -sS -o /dev/null --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1"; then
              echo "Telegram message sent."
            else
              echo "Telegram message could not be sent."
            fi
          }
          fail() {
            echo "::error::$1"
            notify "❌ The GitHub backup timer for the Nightly failed: $1"
            exit 1
          }

          since="$(date -u +%Y-%m-%d)T03:00:00Z"
          hour=$((10#$(date -u +%H)))
          echo "Event: $GITHUB_EVENT_NAME; UTC now: $(date -u +%H:%M); looking for Nightly runs created since $since"

          count="$(gh api "repos/$GH_REPO/actions/workflows/nightly.yml/runs?created=%3E%3D${since}&per_page=1" --jq '.total_count' 2>/dev/null)" \
            || fail "could not read the Nightly runs from GitHub."
          case "$count" in ''|*[!0-9]*) fail "unexpected answer when reading the Nightly runs." ;; esac

          if [ "$count" -gt 0 ]; then
            echo "A Nightly run was already created since 03:00 UTC today ($count). Nothing to do."
            exit 0
          fi

          if [ "$hour" -ge "$CUTOFF_UTC_HOUR" ]; then
            echo "No Nightly run today, but it is past ${CUTOFF_UTC_HOUR}:00 UTC (market hours). Not starting it."
            notify "⚠️ The Nightly did not run tonight and the GitHub backup came too late (market hours). Start it by hand: Actions → Nightly → Run workflow."
            exit 0
          fi

          gh workflow run nightly.yml --ref main -f run_checks=false >/dev/null 2>&1 \
            || fail "could not start the Nightly."
          echo "No Nightly run today; started nightly.yml on main."
          notify "⏰ The Nightly was started by the GitHub backup timer (the Cloudflare timer did not start it)."
