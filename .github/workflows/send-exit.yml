# Telegram /exit: send the SAVED Exit Report (no re-run) as a PDF with a short message. Manual (started by the
# Telegram relay or by hand). If the report's AI section is still empty, the Exit AI (Gemini, low effort) is
# added first, so the PDF always has the AI part. `opus` (Telegram `/exit opus`, owner 2026-11-05): the Exit AI is
# re-run with Opus too (paid, about $0.25), plus its portfolio-wide view, before the PDF is sent.
name: Send Exit Report

on:
  workflow_dispatch:
    inputs:
      opus:
        description: 'Re-run the Exit AI with Claude Opus first (paid, about $0.25; needs an Anthropic key)'
        type: boolean
        default: false
      user:
        description: 'User id. owner = you (repo secrets; the built-in profile if this copy has one, else your Profile tab). Another id uses the secrets named ID_NAME and its Profile tab'
        type: string
        default: owner

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.user || 'owner') == 'owner' && 'sheet-report-writers' || format('sheet-report-writers-{0}', inputs.user) }}
  cancel-in-progress: false

env:
  LONG_HISTORY: 'on'
  TZ: America/New_York
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  SCRIPT_TIME_ZONE: America/New_York
  RUN_USER: ${{ inputs.user || 'owner' }}
  SECRET_PREFIX: ${{ (inputs.user || 'owner') != 'owner' && format('{0}_', inputs.user) || '' }}
  PROFILE_SOURCE: ${{ (inputs.user || 'owner') != 'owner' && 'sheet' || '' }}

defaults:
  run:
    shell: bash

jobs:
  send-exit:
    name: Send the saved Exit Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out the long price history (docs/LONG_HISTORY_PLAN.md; a missing branch is skipped)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: prices
          path: long-history

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Read the user profile tab (not for the default user of a copy with a built-in profile)
        if: env.PROFILE_SOURCE == 'sheet' || hashFiles('backend/src/owner/profile.ts') == ''
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: |
          mkdir -p out
          npm run profile-fetch -- --out "$PWD/out/profile.json"
          echo "PROFILE_FILE=$PWD/out/profile.json" >> "$GITHUB_ENV"

      - name: Add the AI part if it is missing, then send
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          REPORTS_SPREADSHEET_ID: ${{ secrets[format('{0}REPORTS_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          DATA_SPREADSHEET_ID: ${{ secrets[format('{0}DATA_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          FMP_API_KEY: ${{ secrets[format('{0}FMP_API_KEY', env.SECRET_PREFIX)] }}
          ALPHAVANTAGE_KEY: ${{ secrets[format('{0}ALPHAVANTAGE_KEY', env.SECRET_PREFIX)] }}
          FINNHUB_KEY: ${{ secrets[format('{0}FINNHUB_KEY', env.SECRET_PREFIX)] }}
          SEC_CONTACT_EMAIL: ${{ secrets[format('{0}SEC_CONTACT_EMAIL', env.SECRET_PREFIX)] }}
          GEMINI_API_KEY: ${{ secrets[format('{0}GEMINI_API_KEY', env.SECRET_PREFIX)] }}
          ANTHROPIC_API_KEY: ${{ secrets[format('{0}ANTHROPIC_API_KEY', env.SECRET_PREFIX)] }}
          WITH_OPUS: ${{ inputs.opus }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
          TELEGRAM_CHAT_ID: ${{ secrets[format('{0}TELEGRAM_CHAT_ID', env.SECRET_PREFIX)] }}
        run: |
          mkdir -p out
          export RUN_LOG_FILE="$PWD/out/send-exit.log"  # the full log, every level (core/logFile.ts)
          status="$(npm run -s send-exit -- --ai-status 2>>out/send-exit.console.log | tail -1)"
          echo "AI section: $status"
          if [ "$WITH_OPUS" = "true" ]; then
            BUY=false EXIT=true EXIT_GEMINI=true EXIT_OPUS=true EFFORT=medium npm run ai 2>&1 | tee -a out/send-exit.console.log
          elif [ "$status" = "missing" ]; then
            BUY=false EXIT=true EXIT_GEMINI=true EXIT_OPUS=false EFFORT=low npm run ai 2>&1 | tee -a out/send-exit.console.log
          fi
          npm run send-exit 2>&1 | tee -a out/send-exit.console.log
          exit "${PIPESTATUS[0]}"

      - name: Re-lock sheet tabs (always)
        if: always()
        timeout-minutes: 5
        working-directory: backend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets[format('{0}GOOGLE_SERVICE_ACCOUNT_JSON', env.SECRET_PREFIX)] }}
          SPREADSHEET_ID: ${{ secrets[format('{0}SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          REPORTS_SPREADSHEET_ID: ${{ secrets[format('{0}REPORTS_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
          DATA_SPREADSHEET_ID: ${{ secrets[format('{0}DATA_SPREADSHEET_ID', env.SECRET_PREFIX)] }}
        run: npm run lock-sheets

      - name: Check the log for leaked keys
        if: always()
        working-directory: backend
        env:
          FMP_API_KEY: ${{ secrets[format('{0}FMP_API_KEY', env.SECRET_PREFIX)] }}
          ALPHAVANTAGE_KEY: ${{ secrets[format('{0}ALPHAVANTAGE_KEY', env.SECRET_PREFIX)] }}
          FINNHUB_KEY: ${{ secrets[format('{0}FINNHUB_KEY', env.SECRET_PREFIX)] }}
          GEMINI_API_KEY: ${{ secrets[format('{0}GEMINI_API_KEY', env.SECRET_PREFIX)] }}
          ANTHROPIC_API_KEY: ${{ secrets[format('{0}ANTHROPIC_API_KEY', env.SECRET_PREFIX)] }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('{0}TELEGRAM_BOT_TOKEN', env.SECRET_PREFIX)] }}
        run: |
          # Artifacts are NOT masked like the live log is, so check the file itself.
          ls out/send-exit*.log >/dev/null 2>&1 || exit 0
          leaked=0
          for name in FMP_API_KEY ALPHAVANTAGE_KEY FINNHUB_KEY GEMINI_API_KEY ANTHROPIC_API_KEY TELEGRAM_BOT_TOKEN; do
            value="${!name}"
            if [ "${#value}" -ge 8 ] && grep -qF -- "$value" out/send-exit*.log; then
              echo "::error::The value of $name appears in the run log."
              leaked=1
            fi
          done
          if [ "$leaked" = 1 ]; then
            rm -f out/send-exit*.log
            echo "The log was deleted so it is not uploaded."
            exit 1
          fi

      - name: Upload the PDF and log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: send-exit-${{ github.run_id }}
          path: |
            backend/out/v13-report-*.pdf
            backend/out/send-exit*.log
          if-no-files-found: warn
          retention-days: 30
